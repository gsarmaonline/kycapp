# Point the Railway "api" service Config File at /railway.api.toml
# (Settings → Config-as-code). Shared monorepo: keep Root Directory empty.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
watchPatterns = [
  "cmd/**",
  "core/**",
  "internal/**",
  "go.mod",
  "go.sum",
  "Dockerfile.api",
  "railway.api.toml",
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
