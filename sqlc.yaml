version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/queries"
    schema:
      - "internal/store/migrations/000001_init.up.sql"
      - "internal/store/migrations/000002_seed.up.sql"
      - "internal/store/migrations/000003_idempotency.up.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
