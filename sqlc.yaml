version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/queries"
    schema:
      - "internal/store/migrations/000001_init.up.sql"
      - "internal/store/migrations/000002_seed.up.sql"
      - "internal/store/migrations/000003_idempotency.up.sql"
      - "internal/store/migrations/000004_hardening.up.sql"
      - "internal/store/migrations/000005_auth.up.sql"
      - "internal/store/migrations/000006_google_oauth.up.sql"
      - "internal/store/migrations/000007_app_users.up.sql"
      - "internal/store/migrations/000008_dropdown_type.up.sql"
      - "internal/store/migrations/000009_drop_enum_type.up.sql"
      - "internal/store/migrations/000010_email_templates.up.sql"
      - "internal/store/migrations/000011_org_branding.up.sql"
      - "internal/store/migrations/000012_org_email_font.up.sql"
      - "internal/store/migrations/000013_attribute_is_system.up.sql"
      - "internal/store/migrations/000014_automations.up.sql"
      - "internal/store/migrations/000015_billing_payments.up.sql"
      - "internal/store/migrations/000016_user_avatar.up.sql"
      - "internal/store/migrations/000017_entitlement_scope.up.sql"
      - "internal/store/migrations/000018_product_features.up.sql"
      - "internal/store/migrations/000019_org_settings.up.sql"
      - "internal/store/migrations/000020_org_hard_delete.up.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "pg_catalog.jsonb"
            go_type: "encoding/json.RawMessage"
