name: Access

# core/access is the portable authorisation evaluator. It is a separate module
# with zero dependencies because the same logic has to run in the API, the Go
# SDK, and (ported) the TypeScript SDK. The dependency check below is the point:
# if this module ever grows a dependency, it stops being embeddable.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "core/access/**"
      - ".github/workflows/access.yml"

jobs:
  access:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/access
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/access/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test ./... -count=1 -race -cover

      - name: Assert the module stays dependency-free
        run: |
          deps=$(go list -m all | tail -n +2 | wc -l)
          if [ "$deps" -ne 0 ]; then
            echo "core/access must have zero dependencies, found $deps:"
            go list -m all | tail -n +2
            exit 1
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
