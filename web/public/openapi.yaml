components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session token (kyc_sess_…) or API key / service token

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    orgId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Organisation id
    dbId:
      name: dbId
      in: path
      required: true
      schema:
        type: string
    webhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
    hookId:
      name: hookId
      in: path
      required: true
      schema:
        type: string
    membershipId:
      name: id
      in: path
      required: true
      schema:
        type: string
    limitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
    cursorQuery:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque pagination cursor
    qQuery:
      name: q
      in: query
      schema:
        type: string
      description: Search query
    statusQuery:
      name: status
      in: query
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Error:
      # components/responses/Error and components/schemas/Error both map to a Go
      # type named Error. x-go-name disambiguates them for oapi-codegen; other
      # generators and Swagger UI ignore it.
      x-go-name: APIError
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable code (e.g. not_found, validation_error, unauthorized, forbidden, rate_limited)
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    PaginatedMeta:
      type: object
      properties:
        next_cursor:
          type: string
          description: Present when more results exist; pass as ?cursor= on the next request

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        time:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    Organisation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, suspended, archived]
        logo_url:
          type: string
          readOnly: true
        primary_color:
          type: string
        accent_color:
          type: string
        email_footer:
          type: string
        email_font:
          type: string
        email_typography:
          $ref: "#/components/schemas/EmailTypography"
        email_from_name:
          type: string
        email_from_address:
          type: string
        app_user_authority:
          type: string
          enum: [kyc, external]
        app_user_ingest_upsert_key:
          type: string
          enum: [external_id, email]
        app_user_attributes_mode:
          type: string
          enum: [discover, strict]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        platform_admin:
          type: boolean
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Membership:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        user_id:
          type: string
        role_id:
          type: string
        status:
          type: string
          enum: [invited, active, revoked]
        user_email:
          type: string
        user_name:
          type: string
        role_key:
          type: string
        organisation_name:
          type: string
        organisation_slug:
          type: string
        created_at:
          type: string
          format: date-time

    AppUser:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        external_id:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled, archived]
        attributes:
          type: object
          additionalProperties: true

    AttributeDefinition:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        key:
          type: string
        label:
          type: string
        description:
          type: string
        value_type:
          type: string
          enum: [string, number, boolean, date, dropdown]
        section:
          type: string
        sort_order:
          type: integer
        required:
          type: boolean
        enum_values:
          type: array
          items:
            type: string
        is_pii:
          type: boolean
        is_system:
          type: boolean
        status:
          type: string
          enum: [active, archived]

    EmailTemplate:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
          description: Deprecated synced field; prefer body_sections
        body_sections:
          type: array
          items:
            $ref: "#/components/schemas/EmailBodySection"
        from_name:
          type: string
        from_address:
          type: string
        status:
          type: string
          enum: [active, archived]
        is_system:
          type: boolean

    EmailBodySection:
      type: object
      required: [id, content_html]
      properties:
        id:
          type: string
        content_html:
          type: string
        style:
          $ref: "#/components/schemas/RegionStyle"

    EmailTypography:
      type: object
      properties:
        header:
          $ref: "#/components/schemas/RegionStyle"
        body:
          $ref: "#/components/schemas/RegionStyle"
        footer:
          $ref: "#/components/schemas/RegionStyle"

    RegionStyle:
      type: object
      properties:
        font:
          type: string
          enum: [arial, helvetica, verdana, trebuchet, georgia, times, courier]
        size:
          type: integer
          description: px (10–16, 18, 20, 22, 24, 28, 32)
        weight:
          type: integer
          enum: [400, 500, 600, 700]
        style:
          type: string
          enum: [normal, italic]
        text_color:
          type: string
          description: Hex color e.g. #1c1917
        background_color:
          type: string
          description: Hex color
        text_align:
          type: string
          enum: [left, center, right]
        padding_left:
          type: integer
          description: Paragraph indent in px (0, 4, 8, 12, 16, 20, 24, 32, 40, 48)

    Automation:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        name:
          type: string
        trigger:
          type: string
        trigger_params:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
        conditions:
          $ref: "#/components/schemas/AutomationConditions"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationAction"

    AutomationConditions:
      type: object
      properties:
        mode:
          type: string
          enum: [all, any]
        items:
          type: array
          items:
            $ref: "#/components/schemas/AutomationCondition"
        all:
          type: array
          items:
            $ref: "#/components/schemas/AutomationCondition"
        any:
          type: array
          items:
            $ref: "#/components/schemas/AutomationCondition"

    AutomationCondition:
      type: object
      properties:
        field:
          type: string
          description: Bare path (e.g. app_user.country) — see Documentation → Variables
        op:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                type: string

    AutomationAction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          description: send_email, call_webhook, db_insert, delay, etc.
        params:
          type: object
          additionalProperties:
            type: string
        on_success:
          type: string
        on_error:
          type: string

    AutomationRun:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        automation_id:
          type: string
        trigger:
          type: string
        status:
          type: string
          enum: [success, skipped, error]
        detail:
          type: string
        created_at:
          type: string
          format: date-time

    AutomationCatalog:
      type: object
      additionalProperties: true

    Webhook:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        name:
          type: string
        url:
          type: string
        secret_hint:
          type: string
        has_secret:
          type: boolean
        status:
          type: string
        body_template:
          type: string
          description: JSON with {{path}} placeholders

    InboundWebhook:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        name:
          type: string
        url:
          type: string
        auth_mode:
          type: string
          enum: [header, query, path]
        secret_hint:
          type: string
        has_secret:
          type: boolean
        secret:
          type: string
          description: Present after create/rotate or embedded in URL for query/path modes
        status:
          type: string

    OrganisationDatabase:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        name:
          type: string
        driver:
          type: string
          enum: [postgres]
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        username:
          type: string
        password_hint:
          type: string
        has_password:
          type: boolean
        ssl_mode:
          type: string
        status:
          type: string
          enum: [connected, unreachable, disconnected]
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string

    ProductFeature:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        key:
          type: string
        description:
          type: string
        scope:
          type: string
          enum: [product]
        enabled:
          type: boolean
        rollout_percentage:
          type: integer
        overrides:
          type: array
          items:
            type: object
            properties:
              subject_id:
                type: string
              effect:
                type: string
                enum: [include, exclude]

    ProductPlan:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        feature_keys:
          type: array
          items:
            type: string
        prices:
          type: array
          items:
            $ref: "#/components/schemas/ProductPlanPrice"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductPlanPrice:
      type: object
      properties:
        id:
          type: string
        product_plan_id:
          type: string
        interval:
          type: string
          enum: [month, year]
        currency:
          type: string
        unit_amount:
          type: integer
          format: int64
        processor:
          type: string
        processor_product_ref:
          type: string
        processor_price_ref:
          type: string
        status:
          type: string
        synced:
          type: boolean

    Role:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        permission_keys:
          type: array
          items:
            type: string

    Permission:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        resource:
          type: string
        action:
          type: string
        category:
          type: string
        description:
          type: string

    BillingPlan:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        status:
          type: string
        entitlement_keys:
          type: array
          items:
            type: string
        platform_capability_keys:
          type: array
          items:
            type: string
        product_feature_keys:
          type: array
          items:
            type: string

    Entitlement:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        description:
          type: string
        scope:
          type: string
          enum: [platform, product]

    OrgEntitlements:
      type: object
      properties:
        entitlements:
          type: array
          items:
            type: string
        platform_capabilities:
          type: array
          items:
            type: string
        product_features:
          type: array
          items:
            type: string

    Subscription:
      type: object
      properties:
        id:
          type: string
        organisation_id:
          type: string
        plan_id:
          type: string
        status:
          type: string
          enum: [trialing, active, past_due, canceled]
        current_period_end:
          type: string
          format: date-time
          nullable: true
        processor:
          type: string
        subscription_ref:
          type: string

    PlanPrice:
      type: object
      properties:
        id:
          type: string
        plan_id:
          type: string
        interval:
          type: string
          enum: [month, year]
        currency:
          type: string
        unit_amount:
          type: integer
          format: int64
        processor:
          type: string
        processor_price_ref:
          type: string
        status:
          type: string

    OrgIntegration:
      type: object
      properties:
        provider:
          type: string
        status:
          type: string
        secret_hint:
          type: string
        public_key_hint:
          type: string
        has_secret:
          type: boolean
        has_public_key:
          type: boolean

    OrgAPIKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
          description: Empty array means full organisation access
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        revoked_at:
          type: string
          format: date-time
        token:
          type: string
          description: Returned once on create

    PlatformAPIKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
        created_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        token:
          type: string

    StripeCatalogItem:
      type: object
      properties:
        product_ref:
          type: string
        product_name:
          type: string
        price_ref:
          type: string
        interval:
          type: string
        currency:
          type: string
        unit_amount:
          type: integer
        active:
          type: boolean

    StripeCatalogSyncResult:
      type: object
      properties:
        imported:
          type: array
          items:
            $ref: "#/components/schemas/ProductPlan"
        pushed:
          type: array
          items:
            $ref: "#/components/schemas/ProductPlan"
        skipped:
          type: integer

    AuditEvent:
      type: object
      properties:
        id:
          type: string
        actor:
          type: string
        method:
          type: string
        path:
          type: string
        status_code:
          type: integer
        created_at:
          type: string
          format: date-time

    # --- Request bodies (merchant Integration API) ---

    CheckEntitlementRequest:
      description: Check whether an organisation may use an entitlement.
      type: object
      required: [organisation_id, entitlement]
      properties:
        organisation_id:
          type: string
        entitlement:
          type: string
        subject_id:
          type: string
          description: Required for product features with rollout between 1 and 99

    CreateAppUserRequest:
      description: Create an app user under an organisation.
      type: object
      properties:
        email:
          type: string
          format: email
        external_id:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled, archived]
        attributes:
          type: object
          additionalProperties: true

    CreateAttributeDefinitionRequest:
      description: Define a new app user profile field.
      type: object
      required: [key, label, value_type]
      properties:
        key:
          type: string
        label:
          type: string
        value_type:
          type: string
          enum: [string, number, boolean, date, dropdown]
        section:
          type: string
          default: general
        sort_order:
          type: integer
        required:
          type: boolean
        enum_values:
          type: array
          items:
            type: string
        description:
          type: string
        is_pii:
          type: boolean

    CreateProductFeatureRequest:
      description: Create a product feature the organisation can sell.
      type: object
      required: [key]
      properties:
        key:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100

    CreateProductPlanRequest:
      description: Create a product plan.
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
        price:
          type: object
          properties:
            interval:
              type: string
              enum: [month, year]
            currency:
              type: string
            unit_amount:
              type: integer
              format: int64
            status:
              type: string

    InboundWebhookPayload:
      description: Free-form JSON body delivered to an inbound webhook.
      type: object
      additionalProperties: true

    IngestAppUserRequest:
      description: Upsert an app user from an external system.
      type: object
      properties:
        external_id:
          type: string
        email:
          type: string
        display_name:
          type: string
        status:
          type: string
        attributes:
          type: object
          additionalProperties: true

    SetActiveProductPlanRequest:
      description: Set the organisation's active product plan.
      type: object
      properties:
        product_plan_id:
          type: string
          description: Empty string clears active plan

    SetProductFeatureOverridesRequest:
      description: Replace the subject override list for a product feature.
      type: object
      required: [overrides]
      properties:
        overrides:
          type: array
          items:
            type: object
            required: [subject_id, effect]
            properties:
              subject_id:
                type: string
              effect:
                type: string
                enum: [include, exclude]

    SetProductPlanFeaturesRequest:
      description: Replace the feature list on a product plan.
      type: object
      required: [feature_keys]
      properties:
        feature_keys:
          type: array
          items:
            type: string

    UpdateAppUserRequest:
      description: Partial update of an app user.
      type: object
      properties:
        email:
          type: string
        external_id:
          type: string
        display_name:
          type: string
        status:
          type: string
        attributes:
          type: object
          additionalProperties: true

    UpdateAttributeDefinitionRequest:
      description: Partial update of an attribute definition.
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        value_type:
          type: string
          enum: [string, number, boolean, date, dropdown]
        section:
          type: string
        sort_order:
          type: integer
        required:
          type: boolean
        enum_values:
          type: array
          items:
            type: string
        is_pii:
          type: boolean
        status:
          type: string
          enum: [active, archived]

    UpdateProductFeatureRequest:
      description: Partial update of a product feature.
      type: object
      properties:
        description:
          type: string
        enabled:
          type: boolean
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100

    UpdateProductPlanRequest:
      description: Partial update of a product plan.
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, archived]

    UpsertProductPlanPriceRequest:
      description: Create or update a product plan price.
      type: object
      required: [interval, unit_amount]
      properties:
        interval:
          type: string
          enum: [month, year]
        currency:
          type: string
        unit_amount:
          type: integer
          format: int64
        status:
          type: string
