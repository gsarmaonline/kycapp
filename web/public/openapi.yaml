openapi: 3.0.3
info:
  title: KYC Operator API
  version: 1.0.0
  description: |
    Full JSON API for the KYC operator UI and platform operations (sessions, members, roles,
    permissions, org settings, automations, billing admin, and more).

    Authenticated routes require `Authorization: Bearer <token>`:
    - **Session** (`kyc_sess_…`) from Google OAuth or dev login — operator UI
    - **Organisation API key** (`kyc_…`) — merchant backends (see Integration API for the subset)
    - **Platform / env service token** — ops only

    Merchants integrating their product with KYC should use the **Integration API** docs tab
    (app users, attributes, product plans, entitlement checks, feature flags), not Auth or Members/permissions routes.

servers:
  - url: /
    description: Relative to the web app proxy (paths include `/v1`)

tags:
  - name: Auth
    description: Sign-in, session, and current user
  - name: Organisations
    description: Tenant hub, settings, integrations, branding
  - name: Members
    description: Users, memberships, roles, permissions, authorisation checks
  - name: App users
    description: End users of a merchant product
  - name: Attributes
    description: App user attribute schema
  - name: Emails
    description: Email templates for app users
  - name: Automations
    description: Triggered workflows
  - name: Webhooks
    description: Outbound and inbound webhooks
  - name: Databases
    description: Postgres connections for automations
  - name: Billing
    description: Plans, subscriptions, entitlements, Stripe checkout
  - name: Product
    description: Merchant product features, plans, and feature flags
  - name: Platform
    description: Platform API keys, audit, health

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Platform]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"

  /readyz:
    get:
      tags: [Platform]
      summary: Readiness probe (database ping)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/providers:
    get:
      tags: [Auth]
      summary: List available auth providers
      security: []
      responses:
        "200":
          description: Provider flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  google:
                    type: boolean
                  dev_login:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth (redirect)
      security: []
      responses:
        "302":
          description: Redirect to Google
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback (redirect with session token)
      security: []
      responses:
        "302":
          description: Redirect to APP_ORIGIN with `#token=…`
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/dev-login:
    post:
      tags: [Auth]
      summary: Dev-only login (when AUTH_DEV_LOGIN=true)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        default:
          $ref: "#/components/responses/Error"

  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /v1/me:
    get:
      tags: [Auth]
      summary: Current user and memberships
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  memberships:
                    type: array
                    items:
                      $ref: "#/components/schemas/Membership"
                  platform_admin:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations:
    post:
      tags: [Organisations]
      summary: Create organisation
      description: Authenticated users become owner with active free_plan subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: Optional URL-safe identifier
      responses:
        "201":
          description: Created organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [Organisations]
      summary: List organisations
      parameters:
        - $ref: "#/components/parameters/statusQuery"
        - $ref: "#/components/parameters/qQuery"
        - $ref: "#/components/parameters/limitQuery"
        - $ref: "#/components/parameters/cursorQuery"
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Organisation"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      operationId: getOrganisation
      tags: [Organisations]
      summary: Get organisation
      responses:
        "200":
          description: Organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Organisations]
      summary: Update organisation
      description: Requires organisation:update. Colors must be #RGB or #RRGGBB.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum: [active, suspended, archived]
                primary_color:
                  type: string
                accent_color:
                  type: string
                email_footer:
                  type: string
                email_font:
                  type: string
                  enum: [arial, helvetica, verdana, trebuchet, georgia, times, courier]
                email_typography:
                  $ref: "#/components/schemas/EmailTypography"
                email_from_name:
                  type: string
                email_from_address:
                  type: string
                app_user_authority:
                  type: string
                  enum: [kyc, external]
                app_user_ingest_upsert_key:
                  type: string
                  enum: [external_id, email]
                app_user_attributes_mode:
                  type: string
                  enum: [discover, strict]
      responses:
        "200":
          description: Updated organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Organisations]
      summary: Hard-delete organisation
      description: Cascades tenant data. Requires organisation:update.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/orgId"
    post:
      tags: [Organisations]
      summary: Archive organisation (legacy alias for hard delete)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/integrations:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      tags: [Organisations]
      summary: List connected integrations
      description: Secrets returned as masked hints. Requires organisation:update.
      responses:
        "200":
          description: Integration list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgIntegration"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/integrations/stripe:
    parameters:
      - $ref: "#/components/parameters/orgId"
    put:
      tags: [Organisations]
      summary: Connect or update Stripe integration
      description: Omit a field to keep the current value. Requires organisation:update.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                secret_key:
                  type: string
                publishable_key:
                  type: string
      responses:
        "200":
          description: Integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgIntegration"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/integrations/stripe/catalog:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      tags: [Organisations]
      summary: List active recurring Stripe Prices
      responses:
        "200":
          description: Stripe catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StripeCatalogItem"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/integrations/stripe/import:
    parameters:
      - $ref: "#/components/parameters/orgId"
    post:
      tags: [Organisations]
      summary: Import Stripe Prices as product plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [price_ref]
                    properties:
                      price_ref:
                        type: string
                      key:
                        type: string
                      name:
                        type: string
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCatalogSyncResult"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/integrations/stripe/sync:
    parameters:
      - $ref: "#/components/parameters/orgId"
    post:
      tags: [Organisations]
      summary: Push local product plan prices to Stripe
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCatalogSyncResult"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/integrations/{provider}:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - name: provider
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Organisations]
      summary: Disconnect integration
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/databases:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      tags: [Databases]
      summary: List Postgres connections
      responses:
        "200":
          description: Database list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganisationDatabase"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Databases]
      summary: Create Postgres connection
      description: Saves then probes connectivity (SELECT 1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, host, database_name, username, password]
              properties:
                name:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                  default: 5432
                database_name:
                  type: string
                username:
                  type: string
                password:
                  type: string
                ssl_mode:
                  type: string
                  default: require
      responses:
        "201":
          description: Created connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDatabase"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/databases/{dbId}:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/dbId"
    get:
      tags: [Databases]
      summary: Get database connection
      responses:
        "200":
          description: Database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDatabase"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Databases]
      summary: Update database connection
      description: Omit or empty password to keep current; re-probes after save.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                host:
                  type: string
                port:
                  type: integer
                database_name:
                  type: string
                username:
                  type: string
                password:
                  type: string
                ssl_mode:
                  type: string
      responses:
        "200":
          description: Updated database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDatabase"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Databases]
      summary: Delete database connection
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/databases/{dbId}/check:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/dbId"
    post:
      tags: [Databases]
      summary: Re-probe database connectivity
      responses:
        "200":
          description: Updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDatabase"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/databases/{dbId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/dbId"
    post:
      tags: [Databases]
      summary: Mark database disconnected without probing
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDatabase"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/webhooks:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      tags: [Webhooks]
      summary: List outbound webhooks
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Webhooks]
      summary: Create outbound webhook
      description: |
        `body_template` is JSON with `{{path}}` placeholders (see Documentation → Variables).
        Canonical paths include `app_user.email`, `app_user.display_name`, `app_user.<attribute_key>`,
        `organisation.name`, `organisation_id`, `trigger`. Empty template sends full event dump.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                secret:
                  type: string
                body_template:
                  type: string
                  description: JSON string with {{path}} placeholders
      responses:
        "201":
          description: Created webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/webhooks/{webhookId}:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/webhookId"
    get:
      tags: [Webhooks]
      summary: Get outbound webhook
      responses:
        "200":
          description: Webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Webhooks]
      summary: Update outbound webhook
      description: Omit or empty secret to keep current. body_template uses {{path}} placeholders (Documentation → Variables).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                secret:
                  type: string
                status:
                  type: string
                body_template:
                  type: string
      responses:
        "200":
          description: Updated webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Webhooks]
      summary: Delete outbound webhook
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/inbound-webhooks:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      tags: [Webhooks]
      summary: List inbound webhooks
      responses:
        "200":
          description: Inbound webhook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboundWebhook"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Webhooks]
      summary: Create inbound webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                auth_mode:
                  type: string
                  enum: [header, query, path]
                  default: header
                secret:
                  type: string
                status:
                  type: string
      responses:
        "201":
          description: Created inbound webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundWebhook"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/inbound-webhooks/{hookId}:
    parameters:
      - $ref: "#/components/parameters/orgId"
      - $ref: "#/components/parameters/hookId"
    get:
      tags: [Webhooks]
      summary: Get inbound webhook
      responses:
        "200":
          description: Inbound webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundWebhook"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Webhooks]
      summary: Update inbound webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                auth_mode:
                  type: string
                  enum: [header, query, path]
                status:
                  type: string
                rotate:
                  type: boolean
                  description: Rotate secret when true
      responses:
        "200":
          description: Updated inbound webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundWebhook"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Webhooks]
      summary: Delete inbound webhook
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /v1/hooks/inbound/{hookId}:
    parameters:
      - $ref: "#/components/parameters/hookId"
    post:
      operationId: receiveInboundWebhook
      tags: [Webhooks]
      summary: Receive inbound webhook (header or query auth)
      security: []
      description: Public endpoint. Auth via X-KYC-Webhook-Secret header or ?secret= / ?token= per auth_mode.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundWebhookPayload"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /v1/hooks/inbound/{hookId}/{token}:
    parameters:
      - $ref: "#/components/parameters/hookId"
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: receiveInboundWebhookWithToken
      tags: [Webhooks]
      summary: Receive inbound webhook (path-token auth)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundWebhookPayload"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/orgId"
    get:
      tags: [Organisations]
      summary: List organisation API keys
      description: Requires api_keys:read. Includes scopes and last_used_at.
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrgAPIKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Organisations]
      summary: Create organisation API key
      description: >
        Token returned once in response. Requires api_keys:manage and the organisation
        api_access entitlement. Empty scopes means full organisation access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                  description: RBAC permission keys; omit or [] for full access
      responses:
        "201":
          description: Created key (includes token once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAPIKey"
        default:
          $ref: "#/components/responses/Error"

  /v1/organisations/{id}/branding/logo:
    parameters:
      - $ref: "#/components/parameters/orgId"
    post:
      tags: [Organisations]
      summary: Upload organisation logo
      description: Multipart field `logo` (png/jpeg/webp, max 1MB). Requires organisation:update.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated organisation with logo_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Organisations]
      summary: Delete organisation logo
      responses:
        "200":
          description: Logo cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        default:
          $ref: "#/components/responses/Error"

