            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeatureFlag'
                    description: Updated flag with overrides
                default:
                    $ref: '#/components/responses/Error'
            summary: Replace feature flag subject overrides
            tags:
