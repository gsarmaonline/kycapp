                - App users
    /v1/organisations/{id}/app-users/ingest:
        parameters:
            - $ref: '#/components/parameters/orgId'
        put:
            description: |
                Lookup uses org app_user_ingest_upsert_key (external_id or email). attributes are merged.
                discover mode auto-creates unknown attribute definitions; strict rejects unknown keys.
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                attributes:
                                    additionalProperties: true
                                    type: object
                                display_name:
                                    type: string
                                email:
                                    type: string
                                external_id:
                                    type: string
                                status:
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/AppUser'
                                    - properties:
                                        created:
                                            example: false
                                            type: boolean
                                      type: object
                    description: Updated app user
                "201":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/AppUser'
                                    - properties:
                                        created:
                                            example: true
                                            type: boolean
                                      type: object
                    description: Created app user
                default:
                    $ref: '#/components/responses/Error'
            summary: Upsert app user from external system
            tags:
                - App users
