info:
    description: |-
        JSON API for merchant backends integrating with KYC (app users, attributes, product plans, entitlements, feature flags).

        Authenticate with an **organisation API key**: `Authorization: Bearer kyc_…` (create keys under Platform → API keys).
        Keys may be scoped to RBAC permissions; empty scopes grant full organisation access. The organisation must have the `api_access` entitlement.

        Operator UI routes (Google OAuth, members, roles, permissions, email/automation config, platform admin) are documented separately under **Operator API**.
    title: KYC Integration API
    version: 1.0.0
openapi: 3.0.3
paths:
    /v1/app-users/{id}:
        delete:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppUser'
                    description: Deleted app user
                default:
                    $ref: '#/components/responses/Error'
            summary: Delete app user
            tags:
                - App users
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppUser'
                    description: App user
                default:
                    $ref: '#/components/responses/Error'
            summary: Get app user
            tags:
                - App users
        parameters:
            - $ref: '#/components/parameters/id'
        patch:
            description: When attributes is sent, replaces the entire attributes map.
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                attributes:
                                    additionalProperties: true
                                    type: object
                                display_name:
                                    type: string
                                email:
                                    type: string
                                external_id:
                                    type: string
                                status:
                                    type: string
                            type: object
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppUser'
                    description: Updated app user
                default:
                    $ref: '#/components/responses/Error'
            summary: Update app user
            tags:
                - App users
