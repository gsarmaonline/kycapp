    /v1/feature-flags/check:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                flag:
                                    type: string
                                organisation_id:
                                    type: string
                                subject_id:
                                    description: Required when rollout_percentage is between 1 and 99
                                    type: string
                            required:
                                - organisation_id
                                - flag
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    enabled:
                                        type: boolean
                                    reason:
                                        enum:
                                            - disabled
                                            - override_include
                                            - override_exclude
                                            - percentage
                                            - full
                                            - "off"
                                        type: string
                                type: object
                    description: Flag check result
                default:
                    $ref: '#/components/responses/Error'
            summary: Check feature flag for a subject
            tags:
