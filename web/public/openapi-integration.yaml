            summary: Get attribute definition
            tags:
                - Attributes
        parameters:
            - $ref: '#/components/parameters/id'
        patch:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                description:
                                    type: string
                                enum_values:
                                    items:
                                        type: string
                                    type: array
                                is_pii:
                                    type: boolean
                                label:
                                    type: string
                                required:
                                    type: boolean
                                section:
                                    type: string
                                sort_order:
                                    type: integer
                                status:
                                    enum:
